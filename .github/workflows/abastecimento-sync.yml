name: Contrato da sincronização de abastecimento
on:
  pull_request:
    paths:
      - 'supabase/migrations/*abastecimento*'
      - 'scripts/validate-abastecimento-sync.mjs'
      - '.github/workflows/abastecimento-sync.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*abastecimento*'
      - 'scripts/validate-abastecimento-sync.mjs'
      - '.github/workflows/abastecimento-sync.yml'
permissions:
  contents: read
jobs:
  equivalencia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-abastecimento-sync.mjs
